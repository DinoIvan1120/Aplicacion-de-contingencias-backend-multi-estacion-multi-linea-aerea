# ===================================================
# application-qa.properties Overrides para QA/QAS
# Se activa con: SPRING_PROFILES_ACTIVE=qa
# ===================================================

# DDL sigue en update, el equipo aun itera el esquema
spring.jpa.hibernate.ddl-auto=update

# JPA sin mostrar SQL en QA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger activo en QA (pruebas de equipo)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Logging nivel INFO en QA
logging.level.com.saasa=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
