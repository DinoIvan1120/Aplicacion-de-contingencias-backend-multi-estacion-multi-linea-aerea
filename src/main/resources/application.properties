# ===== APPLICATION =====
# ===================================================
# application.properties - Configuracion GENERAL
# Los valores sensibles se inyectan desde .env.{perfil}
# El DotenvInitializer activa el perfil y carga el .env
# ===================================================

spring.application.name=saasa-contingencias
server.port=8080

# Dotenv Initializer (debe estar aquo, se ejecuta primero)
context.initializer.classes=com.saasa.contingencias.config.DotenvInitializer

# Zona horaria
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.time-zone=America/Lima

# JPA / Hibernate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update
# Datasource (valores desde .env.{perfil})
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (valores desde .env.{perfil})
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Mail SMTP (valores desde .env.{perfil})
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS (valores desde .env.{perfil})
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Codigo de verificacion
verification.code.expiration.minutes=${VERIFICATION_CODE_EXPIRATION_MINUTES}

# AWS S3 (valores desde .env.{perfil}) - eliminar si tu app no usa S3
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.prefix=${AWS_S3_PREFIX}

# Twilio WhatsApp (valores desde .env.{perfil})
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM}

# Dominio publico propio para el enlace corto del voucher (/v/{correlativo})
# enviado por WhatsApp/correo, ej: https://vouchers.saasa.pe (SIN "/" final)
app.public-base-url=${APP_PUBLIC_BASE_URL}

rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
rate-limit.block-duration-ms=${RATE_LIMIT_BLOCK_DURATION_MS:900000}
rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:600000}

app.migracion.backfill-estaciones.enabled=false

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.forward-headers-strategy=framework




