# ===================================================
# application-prd.properties Overrides para PRD
# Se activa con: SPRING_PROFILES_ACTIVE=prd
# ===================================================

# DDL solo valida, nunca toca el esquema en PRD
spring.jpa.hibernate.ddl-auto=validate

# JPA sin mostrar SQL en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger DESACTIVADO en produccion
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging minimo en produccion
logging.level.com.saasa=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR