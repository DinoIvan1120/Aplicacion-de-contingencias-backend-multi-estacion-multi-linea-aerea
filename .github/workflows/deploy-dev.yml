# ============================================================
# deploy-dev.yml — CI/CD para el ambiente DEV
# Trigger: push a la rama 'develop'
# Destino: EC2 DEV via SSH + DuckDNS
# ============================================================

name: Deploy DEV

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Test, Build & Deploy to EC2 DEV
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests, verificar cobertura y empaquetar JAR
        run: mvn verify --no-transfer-progress

      # ↓ SCP directo desde target/ — sin upload-artifact
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar JAR al EC2
        run: |
          scp -i ~/.ssh/id_rsa \
            target/saasa-contingencias-backend-1.0.0.jar \
            ${{ secrets.DEV_EC2_USER }}@${{ secrets.DEV_EC2_HOST }}:/opt/integrityflow/sgca/dev/app.jar

      - name: Generar .env.dev y reiniciar servicio
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEV_EC2_USER }}@${{ secrets.DEV_EC2_HOST }} << 'ENDSSH'
            set -e

            echo "=== Generando .env.dev ==="
            cat > /opt/integrityflow/sgca/dev/.env.dev << EOF
          SPRING_PROFILES_ACTIVE=dev

          DB_URL=${{ secrets.DEV_DB_URL }}
          DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}

          JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.DEV_JWT_EXPIRATION }}

          CORS_ALLOWED_ORIGIN=${{ secrets.DEV_CORS_ALLOWED_ORIGIN }}

          MAIL_HOST=${{ secrets.DEV_MAIL_HOST }}
          MAIL_PORT=${{ secrets.DEV_MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.DEV_MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.DEV_MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.DEV_MAIL_FROM }}

          VERIFICATION_CODE_EXPIRATION_MINUTES=${{ secrets.DEV_VERIFICATION_CODE_EXPIRATION_MINUTES }}

          AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.DEV_AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.DEV_AWS_S3_BUCKET }}
          AWS_S3_PREFIX=${{ secrets.DEV_AWS_S3_PREFIX }}

          TWILIO_ACCOUNT_SID=${{ secrets.DEV_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.DEV_TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM=${{ secrets.DEV_TWILIO_WHATSAPP_FROM }}
          APP_PUBLIC_BASE_URL=${{ secrets.DEV_APP_PUBLIC_BASE_URL }}
          EOF

            chmod 600 /opt/integrityflow/sgca/dev/.env.dev

            echo "=== Reiniciando servicio sgca-dev ==="
            sudo systemctl restart sgca-dev

            echo "=== Esperando que el servicio levante ==="
            sleep 15

            echo "=== Estado del servicio ==="
            sudo systemctl status sgca-dev --no-pager

            echo "=== Deploy DEV completado exitosamente ==="
          ENDSSH

      - name: Limpiar SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa